<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1424">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="借金を抱えて無人島に漂着！ 島の資源を売るか、道具に投資するか。完済して脱出を目指すサバイバル経営ゲーム。">
<title>無人島サバイバル債務録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="./v2.css">
</head>
<body class="mode-key">
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="hud-status" class="hud-panel">
      <div class="hud-row hud-day"><span id="hud-day">1日目</span><span id="hud-clock">6:00</span></div>
      <div class="hud-row"><span class="hud-lbl">所持金</span><span id="hud-money" class="hud-money">$0</span></div>
      <div class="hud-row"><span class="hud-lbl">借金</span><span id="hud-debt" class="hud-debt">$0</span></div>
      <div class="hud-debtbar"><div id="hud-debtbar-fill"></div></div>
      <div id="hud-deadline" class="hud-deadline"></div>
      <div id="hud-stage" class="hud-deadline"></div>
    </div>
    <div id="hud-gauges" class="hud-panel">
      <div class="gauge" id="g-hp"><span class="g-lbl">体力</span><div class="g-bar"><div class="g-fill"></div></div></div>
      <div class="gauge" id="g-hunger"><span class="g-lbl">空腹</span><div class="g-bar"><div class="g-fill"></div></div></div>
      <div class="gauge" id="g-thirst"><span class="g-lbl">渇き</span><div class="g-bar"><div class="g-fill"></div></div></div>
      <div class="gauge" id="g-st"><span class="g-lbl">スタミナ</span><div class="g-bar"><div class="g-fill"></div></div></div>
      <div id="hud-cond" class="hud-cond"></div>
      <div id="hud-cap" class="hud-cap"></div>
    </div>
    <div id="hud-objective" class="hud-objective"></div>
    <button id="hud-menu" class="hud-menu" tabindex="-1" aria-label="メニュー">≡</button>
    <div id="hotbar" class="hotbar" aria-label="アイテムバー"></div>
  </div>

  <div id="hint" class="hint hidden"></div>
  <div id="toasts"></div>

  <div id="touch" class="hidden">
    <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
    <div id="tbtns">
      <div class="tbtn tb-y" data-b="Y"><b>Y</b><small>食事</small></div>
      <div class="tbtn tb-x" data-b="X"><b>X</b><small>メニュー</small></div>
      <div class="tbtn tb-b" data-b="B"><b>B</b><small>戻る/走る</small></div>
      <div class="tbtn tb-a" data-b="A"><b>A</b><small>調べる</small></div>
    </div>
  </div>

  <div id="dialog" class="hidden">
    <canvas id="dlg-portrait" width="24" height="24"></canvas>
    <div class="dlg-main">
      <div id="dlg-name"></div>
      <div id="dlg-text"></div>
    </div>
    <div id="dlg-next">▼</div>
  </div>

  <div id="modal-root"></div>
  <div id="fade"></div>
  <noscript><p class="noscript">このゲームを遊ぶにはJavaScriptを有効にしてください。</p></noscript>
</div>
<script src="./v2.js"></script>
</body>
</html>
