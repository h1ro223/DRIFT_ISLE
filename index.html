<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DRIFT ISLE">
<meta name="theme-color" content="#0d2238">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="ドット絵の無人島脱出サバイバル。素材を集めて道具を作り、島に残された日記を頼りに脱出しよう。">
<title>DRIFT ISLE ～無人島脱出記～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body data-input="kb">
<div id="app">
  <canvas id="game"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden">
    <div id="hud-l">
      <div id="stats">
        <div class="bar" id="bar-hp"><img id="ic-hp" alt="体力"><div class="track"><i></i></div><b></b></div>
        <div class="bar" id="bar-food"><img id="ic-food" alt="空腹"><div class="track"><i></i></div><b></b></div>
        <div class="bar" id="bar-water"><img id="ic-water" alt="水分"><div class="track"><i></i></div><b></b></div>
        <div class="bar" id="bar-sta"><img id="ic-sta" alt="スタミナ"><div class="track"><i></i></div><b></b></div>
        <div class="bar" id="bar-temp"><img id="ic-temp" alt="体温"><div class="track"><i></i></div><b></b></div>
      </div>
      <div id="effects"></div>
      <div id="quest"></div>
    </div>
    <div id="hud-r">
      <div id="clock"></div>
      <canvas id="mini" width="64" height="64"></canvas>
      <div id="hud-btns"><button class="hb" data-ui="v3d">3D</button><button class="hb" data-ui="map">地図</button><button class="hb" data-ui="menu">メニュー</button></div>
    </div>
    <div id="bossbar" class="hidden"><span id="boss-name"></span><div class="track"><i></i></div></div>
    <div id="notice"></div>
    <div id="toasts"></div>
    <div id="bottom">
      <div id="held-name"></div>
      <div id="hint"></div>
      <div id="hotbar"></div>
    </div>
  </div>

  <!-- ===== タッチ操作 ===== -->
  <div id="touch">
    <div id="joyzone"><div id="joyghost"></div><div id="joybase"><div id="joyknob"></div></div></div>
    <div id="tbtns">
      <button class="tb" id="tb-y" data-b="Y" data-cap="クラフト">Y</button>
      <button class="tb" id="tb-x" data-b="X" data-cap="バッグ">X</button>
      <button class="tb" id="tb-b" data-b="B" data-cap="ダッシュ">B</button>
      <button class="tb big" id="tb-a" data-b="A" data-cap="アクション">A</button>
    </div>
  </div>

  <!-- ===== 航海 ===== -->
  <div id="voyhud" class="hidden">
    <div class="vrow"><span>航路</span><div class="track" id="voy-prog"><i></i></div></div>
    <div class="vrow"><span>いかだ</span><div class="track hp" id="voy-hp"><i></i></div></div>
    <div id="voy-msg"></div>
  </div>

  <!-- ===== メニュー ===== -->
  <div id="modal" class="hidden">
    <div class="panel">
      <div class="phead"><div id="m-tabs" class="tabs scroll"></div><button id="m-close" class="x nav" data-act="close" data-fk="close" aria-label="閉じる">✕</button></div>
      <div id="m-body" class="pbody scroll"></div>
      <div class="pfoot"><span id="m-help"></span></div>
    </div>
  </div>

  <!-- ===== 会話 ===== -->
  <div id="dialog" class="hidden"><div class="dbox"><div id="d-name"></div><div id="d-text" class="scroll"></div><div id="d-choices"></div><div id="d-next">▼</div></div></div>

  <!-- ===== タイトル ===== -->
  <div id="title">
    <div class="t-inner">
      <div class="logo"><h1><span class="l1">DRIFT</span><span class="l2">ISLE</span></h1><p>～ 無人島脱出記 ～</p></div>
      <div id="title-menu" class="scroll"></div>
    </div>
    <footer class="t-foot"><a href="https://github.com/h1ro223" target="_blank" rel="noopener">made by hiro/ヒロ</a><span>v1.0.0</span></footer>
  </div>

  <!-- ===== 倒れたとき ===== -->
  <div id="death" class="hidden"><div class="dbox2"><h2>力尽きた…</h2><p id="death-msg"></p><button class="tbtn nav" data-act="respawn" data-fk="respawn"><b>目を覚ます</b></button><button class="tbtn nav" data-act="dtitle" data-fk="dtitle"><b>タイトルへ</b></button></div></div>

  <!-- ===== エンディング ===== -->
  <div id="ending" class="hidden"><div id="end-body" class="scroll"></div></div>

  <div id="fade"></div>
  <div id="rotate-tip"><span>横画面にすると遊びやすくなります</span><button id="rt-close" aria-label="閉じる">✕</button></div>
  <noscript><p class="nojs">このゲームを遊ぶにはJavaScriptを有効にしてください。</p></noscript>
</div>
<script src="./three.min.js"></script>
<script src="./script.js"></script>
</body>
</html>
